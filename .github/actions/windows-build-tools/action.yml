# The pinned LLVM, CMake and Ninja of the Windows builds, and build_env.cmd in RUNNER_TEMP: every build step
# calls it first for the MSVC headers and libraries (vcvars64) with the pinned tools ahead of the CMake and Ninja
# that vcvars puts on the PATH. With android-ndk, also the NDK the Android player builds with.
name: Windows build tools
description: Installs the pinned LLVM, CMake and Ninja, and the Android NDK when asked, and writes build_env.cmd.
inputs:
  llvm-version:
    description: The official LLVM build to install.
    required: true
  llvm-sha256:
    description: The SHA-256 of that build's Windows installer (LLVM-<version>-win64.exe).
    required: true
  cmake-version:
    description: The CMake release to install.
    required: true
  cmake-sha256:
    description: The SHA-256 of that release's Windows archive (cmake-<version>-windows-x86_64.zip).
    required: true
  ninja-version:
    description: The Ninja release to install.
    required: true
  ninja-sha256:
    description: The SHA-256 of that release's Windows archive (ninja-win.zip).
    required: true
  android-ndk:
    description: Whether to install the NDK of cmake/android_player.cmake into the runner's Android SDK.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install LLVM, CMake and Ninja
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        LLVM_SHA256: ${{ inputs.llvm-sha256 }}
        CMAKE_VERSION: ${{ inputs.cmake-version }}
        CMAKE_SHA256: ${{ inputs.cmake-sha256 }}
        NINJA_VERSION: ${{ inputs.ninja-version }}
        NINJA_SHA256: ${{ inputs.ninja-sha256 }}
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $tools = Join-Path $env:RUNNER_TEMP 'tools'
        New-Item -ItemType Directory -Force -Path $tools | Out-Null
        # GitHub's release pages answer 5xx at times, for minutes on end, while its REST API keeps serving the
        # same assets: when the release page fails, the asset comes through the API, with GH_TOKEN when it is set
        # (without a token the API allows 60 requests an hour). curl waits 1 s before its first retry and doubles
        # the wait each time, so 7 retries span about two minutes. The Linux jobs of .github/workflows/release.yml
        # write a download_release_asset.sh that does the same.
        function Save-ReleaseAsset([string] $repository, [string] $tag, [string] $asset, [string] $file) {
            curl.exe --fail --silent --show-error --location --retry 3 --output $file "https://github.com/$repository/releases/download/$tag/$asset"
            if ($LASTEXITCODE -eq 0) { return }
            Write-Host "The release page did not serve $asset; downloading it through the REST API."
            $authorization = if ($env:GH_TOKEN) { @('--header', "Authorization: Bearer $env:GH_TOKEN") } else { @() }
            $release = curl.exe --fail --silent --show-error --location --retry 7 @authorization "https://api.github.com/repos/$repository/releases/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Reading release $tag of $repository failed." }
            $asset_url = (($release -join "`n" | ConvertFrom-Json).assets | Where-Object name -eq $asset).url
            if (-not $asset_url) { throw "Release $tag of $repository has no asset $asset." }
            curl.exe --fail --silent --show-error --location --retry 7 @authorization --header 'Accept: application/octet-stream' --output $file $asset_url
            if ($LASTEXITCODE -ne 0) { throw "Downloading $asset of $repository $tag failed." }
        }
        # A download is unpacked or run only when it is the file the caller's SHA-256 names; a download without
        # one stops here too.
        function Assert-Sha256([string] $file, [string] $expected) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            if ($actual -ne $expected) { throw "$file has the SHA-256 $actual, not the expected '$expected'." }
        }
        # LLVM in a folder of its own: the runner's preinstalled LLVM is another version.
        $llvm = Join-Path $tools 'llvm'
        Save-ReleaseAsset 'llvm/llvm-project' "llvmorg-$env:LLVM_VERSION" "LLVM-$env:LLVM_VERSION-win64.exe" "$tools\llvm-setup.exe"
        Assert-Sha256 "$tools\llvm-setup.exe" $env:LLVM_SHA256
        Start-Process -FilePath "$tools\llvm-setup.exe" -ArgumentList '/S', "/D=$llvm" -Wait
        $clang_version = & "$llvm\bin\clang++.exe" --version | Select-Object -First 1
        if ($clang_version -notmatch [regex]::Escape($env:LLVM_VERSION)) { throw "Expected clang $env:LLVM_VERSION, found: $clang_version" }
        Save-ReleaseAsset 'Kitware/CMake' "v$env:CMAKE_VERSION" "cmake-$env:CMAKE_VERSION-windows-x86_64.zip" "$tools\cmake.zip"
        Assert-Sha256 "$tools\cmake.zip" $env:CMAKE_SHA256
        Expand-Archive -Path "$tools\cmake.zip" -DestinationPath $tools
        $cmake = Join-Path $tools "cmake-$env:CMAKE_VERSION-windows-x86_64\bin"
        $ninja = Join-Path $tools 'ninja'
        Save-ReleaseAsset 'ninja-build/ninja' "v$env:NINJA_VERSION" 'ninja-win.zip' "$tools\ninja.zip"
        Assert-Sha256 "$tools\ninja.zip" $env:NINJA_SHA256
        Expand-Archive -Path "$tools\ninja.zip" -DestinationPath $ninja
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools on this runner.' }
        @(
            "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul || exit /b 1"
            "@set `"PATH=$llvm\bin;$cmake;$ninja;%PATH%`""
        ) | Set-Content -Encoding ascii -Path (Join-Path $env:RUNNER_TEMP 'build_env.cmd')
    - name: Install the Android NDK
      if: inputs.android-ndk == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:ANDROID_HOME) { throw 'ANDROID_HOME is not set on this runner.' }
        $ndk = (Select-String -Path cmake/android_player.cmake -Pattern 'set\(UNRAVEL_ANDROID_NDK_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
        & (Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat') --install "ndk;$ndk"
        if ($LASTEXITCODE -ne 0) { throw "Installing NDK $ndk failed." }
