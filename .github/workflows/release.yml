# Builds the editor packages (the CPack zips) on Windows and Linux and attaches them to a GitHub release.
#
# It runs only by hand (Actions > release > Run workflow) and builds one commit into a release. The
# version input takes what `git describe --tags` prints: v1.2.1-153-g1a2b3c4d builds commit 1a2b3c4d and
# uploads UnravelEngine-1.2.1-153-<platform>.zip to release v1.2.1, the nearest tag before that commit,
# replacing the older build of each platform there.
#
# Each platform has a checkbox, all but Ubuntu 22.04 ticked by default. Only the ticked platforms build,
# and the release gets their packages only when every one of them builds.
#
# To release a new version, push its tag (`git tag v1.3.0`, `git push origin v1.3.0`) and run the
# workflow on that tag: a tag without a release gets one, as a draft to review and publish.
#
# Windows builds with clang in GNU-driver mode (preset windows-x64-clang-msvc-gnu). Linux builds inside
# an Ubuntu container, so the binaries need no newer glibc than that release has: the 20.04 package runs
# on 20.04 and later.
#
# Every package carries the Android and browser player templates, which are the same on every platform. Each
# platform builds its own by default. A share checkbox builds that player once, on Windows, and every package
# takes that copy instead, which saves the other builds of it. Ubuntu 20.04's Python is older than the browser
# player's Emscripten needs, so its job builds that player with a prebuilt standalone Python.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Commit to build: a version as git describe prints it (v1.2.1-153-g1a2b3c4d), a commit, a branch or a tag. Empty builds the head of the branch chosen above.'
        required: false
        default: ''
      build_windows:
        description: 'Build the Windows package.'
        type: boolean
        default: true
      build_ubuntu_20_04:
        description: 'Build the Ubuntu 20.04 package.'
        type: boolean
        default: true
      build_ubuntu_22_04:
        description: 'Build the Ubuntu 22.04 package.'
        type: boolean
        default: true
      build_ubuntu_24_04:
        description: 'Build the Ubuntu 24.04 package.'
        type: boolean
        default: true
      build_ubuntu_26_04:
        description: 'Build the Ubuntu 26.04 package.'
        type: boolean
        default: true
      share_android_player:
        description: 'Build the Android player once and put that copy in every package. Unchecked, each platform builds its own.'
        type: boolean
        default: false
      share_web_player:
        description: 'Build the browser player once and put that copy in every package. Unchecked, each platform builds its own.'
        type: boolean
        default: false
      replace_previous_builds:
        description: 'Remove the older builds of the same platforms from the release after the upload.'
        type: boolean
        default: true
      publish:
        description: 'Upload to the release. Unchecked, the packages stay workflow artifacts only.'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # CMake 3.x: CMake 4 refuses dependencies that still declare a minimum below 3.5.
  CMAKE_VERSION: '3.31.12'
  NINJA_VERSION: '1.13.2'
  # Windows clang (official LLVM build); each Linux target names its clang in the targets below.
  LLVM_VERSION: '21.1.8'
  # Windows .NET; on Linux install_dotnet.sh picks the SDK.
  DOTNET_VERSION: '10.0.x'
  # The .NET SDK the browser player builds with (game/web/UnravelWebPlayer.csproj): its wasm-tools workload
  # brings the Emscripten the player compiles with.
  WEB_DOTNET_SDK_VERSION: '11.0.100-rc.3.26522.148'
  # The Python that Emscripten runs on where the release's own is older than it needs (3.10; Ubuntu 20.04 has
  # 3.8): a prebuilt CPython of python-build-standalone, checked against the SHA-256 its release publishes.
  PYTHON_STANDALONE_RELEASE: '20261026'
  PYTHON_STANDALONE_VERSION: '3.12.16'
  PYTHON_STANDALONE_SHA256: '6a79e922e50006b601f29e688407659da1c2b86ebcd4e9c7254cf234be8b89de'
  # Unity builds at -O2 take about 3 GB per compiler; more parallel jobs run the runners out of memory.
  BUILD_JOBS: '3'
  BUILD_DIR: build/Release

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      linux_matrix: ${{ steps.targets.outputs.linux_matrix }}
      has_linux: ${{ steps.targets.outputs.has_linux }}
      players_matrix: ${{ steps.targets.outputs.players_matrix }}
      has_players: ${{ steps.targets.outputs.has_players }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Resolve the commit, release and package version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          requested="${REQUESTED:-$GITHUB_SHA}"
          sha="$(git rev-parse --verify --quiet "${requested}^{commit}" || git rev-parse --verify --quiet "origin/${requested}^{commit}" || true)"
          if [ -z "$sha" ]; then
            echo "::error::'${requested}' is not a commit, branch, tag or version of this repository."
            exit 1
          fi
          # The same describe as CMakeLists.txt, which names the packages.
          if ! describe="$(git describe --tags --abbrev=8 "$sha")"; then
            echo "::error::No tag precedes ${sha}, so it has no version."
            exit 1
          fi
          # git finds a typed version's commit by its hash alone: the tag and the count must match too.
          if [[ "$requested" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)-g[0-9a-f]+$ ]]; then
            actual="${describe#v}"
            actual="${actual%-g*}"
            if [ "${BASH_REMATCH[1]}" != "$actual" ]; then
              echo "::error::${requested} names commit ${sha}, whose version is ${describe}."
              exit 1
            fi
          fi
          release_tag="$(git describe --tags --abbrev=0 "$sha")"
          package_version="$(sed -E -e 's/-g[0-9a-f]+$//' -e 's/^v//' <<< "$describe")"
          {
            echo "sha=${sha}"
            echo "release_tag=${release_tag}"
            echo "package_version=${package_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${describe} (${sha}) as UnravelEngine-${package_version} for release ${release_tag}." >> "$GITHUB_STEP_SUMMARY"
      # Each Linux target builds in its image's container with its clang when its checkbox is ticked: build_
      # and its name with _ for - and . (ubuntu-20.04 -> build_ubuntu_20_04). packages: the GCC whose C++
      # library clang compiles against (clang takes the newest GCC installed), no newer than the libstdc++
      # the release ships, and the release's pipewire. 26.04 ships the libstdc++ of a GCC 16 snapshot, so
      # it builds against its default GCC 15. standalone_python: the release's Python is older than the 3.10 the
      # browser player's Emscripten needs, so its job installs a prebuilt one.
      #
      # Each target's android_player and web_player say whether its job builds that player (build) or takes the
      # copy the players job builds once (shared), as the share checkboxes ask.
      - name: Choose the Linux targets and the shared players
        id: targets
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          share_android="$(jq -r '.share_android_player | tostring' <<< "$INPUTS")"
          share_web="$(jq -r '.share_web_player | tostring' <<< "$INPUTS")"
          targets="$(jq -c --argjson inputs "$INPUTS" --arg share_android "$share_android" --arg share_web "$share_web" '
            [.[] | select($inputs["build_" + (.name | gsub("[-.]"; "_"))] | tostring == "true")
              | .android_player = (if $share_android == "true" then "shared" else "build" end)
              | .web_player = (if $share_web == "true" then "shared" else "build" end)]' <<'EOF'
          [
            {"name": "ubuntu-20.04", "image": "ubuntu:20.04", "clang": "18", "packages": "g++-10 libpipewire-0.2-dev", "standalone_python": true},
            {"name": "ubuntu-22.04", "image": "ubuntu:22.04", "clang": "18", "packages": "g++-12 libpipewire-0.3-dev", "standalone_python": false},
            {"name": "ubuntu-24.04", "image": "ubuntu:24.04", "clang": "21", "packages": "g++-14 libpipewire-0.3-dev", "standalone_python": false},
            {"name": "ubuntu-26.04", "image": "ubuntu:26.04", "clang": "21", "packages": "g++-15 libpipewire-0.3-dev", "standalone_python": false}
          ]
          EOF
          )"
          if [ "$targets" = "[]" ] && [ "$(jq -r '.build_windows | tostring' <<< "$INPUTS")" != "true" ]; then
            echo "::error::No platform is ticked."
            exit 1
          fi
          players="$(jq -c -n --arg android "$share_android" --arg web "$share_web" '[
            (if $android == "true" then {"name": "Android player", "target": "android_player", "folder": "android-arm64", "artifact": "android-player"} else empty end),
            (if $web == "true" then {"name": "Browser player", "target": "web_player", "folder": "web", "artifact": "web-player"} else empty end)
          ]')"
          # A matrix with no entries is an error, so a job without one is skipped instead.
          {
            echo "linux_matrix={\"include\":${targets}}"
            echo "has_linux=$([ "$targets" != "[]" ] && echo true || echo false)"
            echo "players_matrix={\"include\":${players}}"
            echo "has_players=$([ "$players" != "[]" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # The players built once for every package (cmake/android_player.cmake, cmake/web_player.cmake). Only the
  # player's target and what it needs are built: UNRAVEL_PLAYERS_AFTER_EDITOR=OFF builds it without the editor.
  players:
    name: ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.has_players == 'true'
    runs-on: windows-2025-vs2026
    strategy:
      matrix: ${{ fromJSON(needs.resolve.outputs.players_matrix) }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Allow long paths in git
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0 # the template's engine version comes from git describe
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/windows-build-tools
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          cmake-version: ${{ env.CMAKE_VERSION }}
          ninja-version: ${{ env.NINJA_VERSION }}
          android-ndk: ${{ matrix.target == 'android_player' }}
      - uses: ./.github/actions/web-player-dotnet
        if: matrix.target == 'web_player'
        with:
          sdk-version: ${{ env.WEB_DOTNET_SDK_VERSION }}
      # ON fails the configure rather than skip the template.
      - name: Configure
        env:
          ANDROID_PLAYER: ${{ matrix.target == 'android_player' && 'ON' || 'OFF' }}
          WEB_PLAYER: ${{ matrix.target == 'web_player' && 'ON' || 'OFF' }}
        run: |
          call "%RUNNER_TEMP%\build_env.cmd" || exit /b 1
          cmake --preset windows-x64-clang-msvc-gnu -B %BUILD_DIR% -DCMAKE_BUILD_TYPE=Release -DUNRAVEL_PLAYERS_AFTER_EDITOR=OFF -DUNRAVEL_ANDROID_PLAYER=%ANDROID_PLAYER% -DUNRAVEL_WEB_PLAYER=%WEB_PLAYER% "-DUNRAVEL_WEB_DOTNET=%WEB_DOTNET%" || exit /b 1
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          call "%RUNNER_TEMP%\build_env.cmd" || exit /b 1
          cmake --build %BUILD_DIR% --target %TARGET% || exit /b 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.BUILD_DIR }}/bin/players/${{ matrix.folder }}
          if-no-files-found: error
          include-hidden-files: true

  # Runs when the players job is skipped (nothing shared) as when it succeeds: it waits for it only to take the
  # shared players.
  windows:
    name: windows
    needs: [resolve, players]
    if: ${{ !cancelled() && inputs.build_windows && !contains(needs.*.result, 'failure') }}
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: cmd
    steps:
      - name: Allow long paths in git
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0 # the package version comes from git describe
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/windows-build-tools
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          cmake-version: ${{ env.CMAKE_VERSION }}
          ninja-version: ${{ env.NINJA_VERSION }}
          android-ndk: ${{ !inputs.share_android_player }}
      - uses: ./.github/actions/web-player-dotnet
        if: ${{ !inputs.share_web_player }}
        with:
          sdk-version: ${{ env.WEB_DOTNET_SDK_VERSION }}
      # The presets use single-configuration Ninja without a build type, so Release is set here. A player built
      # here is ON, which fails the configure rather than package an editor that cannot deploy to that platform;
      # a shared one is OFF and comes from the players job.
      - name: Configure
        env:
          ANDROID_PLAYER: ${{ inputs.share_android_player && 'OFF' || 'ON' }}
          WEB_PLAYER: ${{ inputs.share_web_player && 'OFF' || 'ON' }}
        run: |
          call "%RUNNER_TEMP%\build_env.cmd" || exit /b 1
          clang++ --version || exit /b 1
          cmake --preset windows-x64-clang-msvc-gnu -B %BUILD_DIR% -DCMAKE_BUILD_TYPE=Release -DUNRAVEL_ANDROID_PLAYER=%ANDROID_PLAYER% -DUNRAVEL_WEB_PLAYER=%WEB_PLAYER% "-DUNRAVEL_WEB_DOTNET=%WEB_DOTNET%" || exit /b 1
      - name: Build
        run: |
          call "%RUNNER_TEMP%\build_env.cmd" || exit /b 1
          cmake --build %BUILD_DIR% --parallel %BUILD_JOBS% || exit /b 1
      - uses: actions/download-artifact@v8
        if: inputs.share_android_player
        with:
          name: android-player
          path: ${{ env.BUILD_DIR }}/bin/players/android-arm64
      - uses: actions/download-artifact@v8
        if: inputs.share_web_player
        with:
          name: web-player
          path: ${{ env.BUILD_DIR }}/bin/players/web
      - name: Package
        run: |
          call "%RUNNER_TEMP%\build_env.cmd" || exit /b 1
          cmake --build %BUILD_DIR% --target package || exit /b 1
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: ${{ env.BUILD_DIR }}/UnravelEngine-*.zip
          if-no-files-found: error
          compression-level: 0

  # Runs when the players job is skipped (nothing shared) as when it succeeds, like the Windows job.
  linux:
    name: ${{ matrix.name }}
    needs: [resolve, players]
    if: ${{ !cancelled() && needs.resolve.outputs.has_linux == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.linux_matrix) }}
    container:
      image: ${{ matrix.image }}
      # Preinstalled host tools this job never uses, mounted so the first step can delete them: the
      # sources, the build with its player sub-builds, the NDK and .NET need the disk space.
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
    env:
      DEBIAN_FRONTEND: noninteractive
      CLANG_VERSION: ${{ matrix.clang }}
      ANDROID_PLAYER: ${{ matrix.android_player == 'build' && 'ON' || 'OFF' }}
      WEB_PLAYER: ${{ matrix.web_player == 'build' && 'ON' || 'OFF' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: |
          df -h /
          rm -rf /host/android/* /host/dotnet/*
          df -h /
      - name: Install the build packages
        run: |
          apt-get update -o Acquire::Retries=5
          apt-get install -y --no-install-recommends ca-certificates curl git gnupg pkg-config python3 sudo tzdata unzip
          # The release's own clang when it carries that version (20.04 has 18 in its updates, 26.04 has
          # 21), apt.llvm.org otherwise. The install candidate decides: apt-cache show also succeeds for a
          # name that other packages only refer to, as 24.04 does with clang-21.
          candidate="$(apt-cache policy "clang-${CLANG_VERSION}" 2> /dev/null | sed -n 's/^ *Candidate: //p' || true)"
          if [ -z "$candidate" ] || [ "$candidate" = "(none)" ]; then
            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/apt-llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${CLANG_VERSION} main" > /etc/apt/sources.list.d/apt-llvm.list
            apt-get update -o Acquire::Retries=5
          fi
          apt-get install -y --no-install-recommends \
            "clang-${CLANG_VERSION}" "clang-tools-${CLANG_VERSION}" ${{ matrix.packages }} \
            libglew-dev libgtk-3-dev libasound2-dev alsa-tools libjack-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libglu1-mesa-dev libdbus-1-dev zlib1g-dev
      # The release's own CMake can be older than the presets need (3.21; Ubuntu 20.04 has 3.16).
      - name: Install CMake and Ninja
        run: |
          curl -fsSL --retry 3 "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local
          curl -fsSL --retry 3 -o /tmp/ninja.zip "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          unzip -o /tmp/ninja.zip -d /usr/local/bin
          cmake --version
          ninja --version
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0 # the package version comes from git describe
          submodules: recursive
          persist-credentials: false
      # The checkout belongs to the runner's user and the container runs as root: without this, git
      # refuses the repository and CMake's git describe fails.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory '*'
      # The repository's install scripts install into a user's home and refuse root, so they run as a
      # user made for them; the build takes the locations they set up from that user's profile.
      - name: Install .NET
        run: |
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\nDefaults env_keep += "DEBIAN_FRONTEND"\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          sudo -u builder -H bash ./install_dotnet.sh
          sudo -u builder -H bash -lc 'printf "DOTNET_ROOT=%s\n" "$DOTNET_ROOT"' >> "$GITHUB_ENV"
          sudo -u builder -H bash -lc 'echo "$DOTNET_ROOT"' >> "$GITHUB_PATH"
      - name: Install the Android SDK
        if: matrix.android_player == 'build'
        run: |
          sudo -u builder -H bash ./install_android_studio.sh
          sudo -u builder -H bash -lc 'printf "ANDROID_HOME=%s\nJAVA_HOME=%s\n" "$ANDROID_HOME" "$JAVA_HOME"' >> "$GITHUB_ENV"
      - uses: ./.github/actions/web-player-dotnet
        if: matrix.web_player == 'build'
        with:
          sdk-version: ${{ env.WEB_DOTNET_SDK_VERSION }}
      # Into a folder of its own; the configure hands it to Emscripten (UNRAVEL_WEB_PYTHON). Emscripten downloads
      # its WebGPU port with Python, so SSL_CERT_FILE points that Python at Ubuntu's certificate bundle, wherever
      # its own OpenSSL looks by default.
      - name: Install Python for Emscripten
        if: matrix.standalone_python && matrix.web_player == 'build'
        run: |
          set -euo pipefail
          archive="cpython-${PYTHON_STANDALONE_VERSION}+${PYTHON_STANDALONE_RELEASE}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/${archive}" "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_STANDALONE_RELEASE}/${archive}"
          echo "${PYTHON_STANDALONE_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p /opt/python-standalone
          tar -xzf "/tmp/${archive}" -C /opt/python-standalone --strip-components=1
          rm "/tmp/${archive}"
          /opt/python-standalone/bin/python3 --version
          {
            echo "WEB_PYTHON=/opt/python-standalone/bin/python3"
            echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt"
          } >> "$GITHUB_ENV"
      # The presets use single-configuration Ninja without a build type, so Release is set here. A player built
      # here is ON, which fails the configure rather than package an editor that cannot deploy to that platform;
      # a shared one is OFF and comes from the players job. clang -v names the GCC installation it compiles
      # against.
      - name: Configure
        run: |
          "clang++-${CLANG_VERSION}" -v
          cmake --preset "linux-clang-${CLANG_VERSION}" -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DUNRAVEL_ANDROID_PLAYER="$ANDROID_PLAYER" -DUNRAVEL_WEB_PLAYER="$WEB_PLAYER" -DUNRAVEL_WEB_DOTNET="${WEB_DOTNET:-}" ${WEB_PYTHON:+"-DUNRAVEL_WEB_PYTHON=$WEB_PYTHON"}
      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel "$BUILD_JOBS"
      - uses: actions/download-artifact@v8
        if: matrix.android_player == 'shared'
        with:
          name: android-player
          path: ${{ env.BUILD_DIR }}/bin/players/android-arm64
      - uses: actions/download-artifact@v8
        if: matrix.web_player == 'shared'
        with:
          name: web-player
          path: ${{ env.BUILD_DIR }}/bin/players/web
      - name: Package
        run: cmake --build "$BUILD_DIR" --target package
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: ${{ env.BUILD_DIR }}/UnravelEngine-*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish
    needs: [resolve, players, windows, linux]
    # A platform left unticked is skipped and does not stop the upload; a failed build does.
    if: ${{ !cancelled() && inputs.publish && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Upload the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.package_version }}
          REPLACE_PREVIOUS_BUILDS: ${{ inputs.replace_previous_builds }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.zip)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::The build jobs produced no packages."
            exit 1
          fi
          prefix="UnravelEngine-${PACKAGE_VERSION}-"
          for package in "${packages[@]}"; do
            if [[ "$(basename "$package")" != "$prefix"* ]]; then
              echo "::error::$(basename "$package") is not a package of version ${PACKAGE_VERSION}."
              exit 1
            fi
          done
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
            echo "Created release ${RELEASE_TAG} as a draft." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          # An older build of a platform has the same name after its version, e.g. -Windows-AMD64.zip.
          if [ "$REPLACE_PREVIOUS_BUILDS" = "true" ]; then
            assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for package in "${packages[@]}"; do
              name="$(basename "$package")"
              platform="${name#"$prefix"}"
              while IFS= read -r asset; do
                if [[ -n "$asset" && "$asset" != "$name" && "$asset" == UnravelEngine-[0-9]*"-${platform}" ]]; then
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  echo "Removed ${asset}." >> "$GITHUB_STEP_SUMMARY"
                fi
              done <<< "$assets"
            done
          fi
          for package in "${packages[@]}"; do
            echo "Uploaded $(basename "$package") to ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"
          done
