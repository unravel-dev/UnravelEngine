name: linux

#on: [push, pull_request]
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Unity builds at -O2 take about 3 GB per compiler; more parallel jobs run the runners out of memory.
  BUILD_JOBS: '3'

jobs:
  build:
    runs-on: ${{matrix.config.os}}
    strategy:
      fail-fast: false
      matrix:
        config:
        # https://github.com/actions/virtual-environments/tree/main/images/linux
        # Ubuntu 20.04 entries use pipewire-0.2
        #- { os: "ubuntu-20.04", cc: "gcc-10",   cxx: "g++-10",   pipewire: "libpipewire-0.2-dev" }
        #- { os: "ubuntu-20.04", cc: "clang-12", cxx: "clang++-12", pipewire: "libpipewire-0.2-dev" }
        # Ubuntu 22.04 entries use pipewire-0.3
        - { os: "ubuntu-22.04", cc: "gcc-12",   cxx: "g++-12",    pipewire: "libpipewire-0.3-dev" }
        - { os: "ubuntu-22.04", cc: "clang-15", cxx: "clang++-15", pipewire: "libpipewire-0.3-dev" }
        
        # Ubuntu 24.04 entries use pipewire-0.3
        - { os: "ubuntu-24.04", cc: "gcc-13",   cxx: "g++-13",    pipewire: "libpipewire-0.3-dev" }
        - { os: "ubuntu-24.04", cc: "clang-19", cxx: "clang++-19", pipewire: "libpipewire-0.3-dev" }

    steps:
    - name: Setup
      run: |
        sudo apt-get update -o Acquire::Retries=10
        sudo apt-get install -y cmake
        sudo apt-get install -y ninja-build
        sudo apt-get install -y ${{ matrix.config.cc }}
        sudo apt-get install -y ${{ matrix.config.cxx }}
        # sudo apt-get install -y mono-devel
        sudo apt-get install -y libglew-dev
        sudo apt-get install -y libgtk-3-dev
        sudo apt-get install -y libasound2-dev
        sudo apt-get install -y alsa-tools
        sudo apt-get install -y libjack-dev
        sudo apt-get install -y libudev-dev
        sudo apt-get install -y ${{ matrix.config.pipewire }}

    # NEW: install matching clang-tools and expose SCANDEPS path
    - name: Setup clang-scan-deps (only for Clang)
      if: contains(matrix.config.cc, 'clang-')
      run: |
        set -euo pipefail
        ver=$(echo "${{ matrix.config.cc }}" | sed -n 's/[^0-9]*\([0-9]\+\).*/\1/p')
        sudo apt-get install -y "clang-tools-$ver" || true
        if command -v "clang-scan-deps-$ver" >/dev/null; then
          echo "SCANDEPS=$(command -v clang-scan-deps-$ver)" >> "$GITHUB_ENV"
        elif command -v clang-scan-deps >/dev/null; then
          echo "SCANDEPS=$(command -v clang-scan-deps)" >> "$GITHUB_ENV"
        else
          echo "clang-scan-deps not found" >&2
          exit 1
        fi
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '9.0.x'
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-depth: 0 # the engine version comes from git describe
    # The preset is a Release build. The player templates are left to the release workflow: their sub-builds
    # would take most of the run.
    - name: Build
      run: |
        cmake --preset linux-${{matrix.config.cc}} -DUNRAVEL_ANDROID_PLAYER=OFF -DUNRAVEL_WEB_PLAYER=OFF
        cmake --build --preset linux-${{matrix.config.cc}}-release --parallel "$BUILD_JOBS"
    # Every suite of the test runner. None needs a graphics device (a suite that needs a renderer starts bgfx's
    # Noop one), and the tools some suites run (shaderc, texturec, the script bridge, the player) are built
    # above. The runner ends with a non-zero exit code when a check fails, which fails the job.
    - name: Test
      run: develop/build/linux-${{matrix.config.cc}}/bin/unravel-tests
